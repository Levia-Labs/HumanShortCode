version: "3"

# Python package tasks. Include from a root Taskfile with `includes: { python: tasks/python.yml }`.
# Run from the repo root; each command runs inside python/.

vars:
  PY_DIR: '{{.PY_DIR | default (printf "%s/languages/python" .ROOT_DIR)}}'

tasks:
  test:
    desc: "Run the Python test suite with pytest via uv"
    dir: "{{.PY_DIR}}"
    cmds:
      - uv run pytest

  build:
    desc: "Build sdist and wheel into languages/python/dist with uv"
    dir: "{{.PY_DIR}}"
    cmds:
      - uv build

  check:
    desc: "Validate languages/python/dist/* metadata with twine"
    dir: "{{.PY_DIR}}"
    cmds:
      - uvx twine check dist/*

  publish:
    desc: "Upload languages/python/dist/* to PyPI. Requires CONFIRM=yes and UV_PUBLISH_TOKEN in the environment"
    dir: "{{.PY_DIR}}"
    preconditions:
      - sh: '[ "{{.CONFIRM}}" = "yes" ]'
        msg: "publish is irreversible; rerun with CONFIRM=yes"
      - sh: '[ -n "${UV_PUBLISH_TOKEN:-}" ]'
        msg: "UV_PUBLISH_TOKEN is not set"
    cmds:
      - uv publish dist/*
