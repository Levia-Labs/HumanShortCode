version: "3"

tasks:
  test:
    desc: "Build and run the JavaScript package tests. Usage: task javascript:test"
    dir: "{{.TASKFILE_DIR}}/../javascript"
    cmds:
      - npm test

  build:
    desc: "Compile javascript/src to javascript/dist. Usage: task javascript:build"
    dir: "{{.TASKFILE_DIR}}/../javascript"
    cmds:
      - npm run build

  pack:
    desc: "List the files npm would publish, without writing a tarball. Usage: task javascript:pack"
    dir: "{{.TASKFILE_DIR}}/../javascript"
    deps: [build]
    cmds:
      - npm pack --dry-run

  publish:
    desc: "Publish human-short-code to npm. Usage: task javascript:publish CONFIRM=yes"
    dir: "{{.TASKFILE_DIR}}/../javascript"
    preconditions:
      - sh: '[ "{{.CONFIRM}}" = "yes" ]'
        msg: "refusing to publish: pass CONFIRM=yes"
    cmds:
      - npm publish
